name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore Comercio.sln

      - name: Build
        run: dotnet build Comercio.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test Comercio.sln --no-build --configuration Release --verbosity normal
